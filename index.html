<!DOCTYPE html>
<html lang="da">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ulveangreb Danmark · Databank</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@600;800&family=DM+Sans:ital,wght@0,400;0,500;1,400&family=DM+Mono&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css"/>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --s:#1b3525;--st:#c0d8be;--sm:#608070;--sb:#24412e;
  --acc:#3a7550;--amb:#7ec47a;--bg:#edf2e8;
  --txt:#182018;--mt:#527060;--bdr:#c4d8be;--wh:#ffffff;
  --pw:390px;--sw:272px;--hh:54px
}
html,body{height:100%;overflow:hidden;font-family:'DM Sans',sans-serif;color:var(--txt)}

/* HEADER */
header{position:fixed;inset:0 0 auto 0;height:var(--hh);background:var(--s);display:flex;align-items:center;z-index:600;border-bottom:1px solid var(--sb)}
.logo{padding:0 20px;font-family:'Syne',sans-serif;font-weight:800;font-size:15px;color:var(--st);letter-spacing:-.3px;border-right:1px solid var(--sb);height:100%;display:flex;align-items:center;white-space:nowrap}
.logo em{color:var(--acc);font-style:normal}
.hstats{display:flex}
.hs{padding:0 16px;border-right:1px solid var(--sb);display:flex;flex-direction:column;justify-content:center}
.hs .v{font-family:'DM Mono',monospace;font-size:17px;color:var(--amb);line-height:1.1}
.hs .l{font-size:9px;color:var(--sm);text-transform:uppercase;letter-spacing:1px}
.hmock{margin-left:auto;padding:0 16px;font-size:10px;color:var(--sm);font-style:italic;display:flex;align-items:center;gap:5px}
.hmock::before{content:'';width:6px;height:6px;border-radius:50%;background:var(--amb);flex-shrink:0}

/* LAYOUT */
.layout{position:fixed;top:var(--hh);inset-inline:0;bottom:0;display:flex}

/* SIDEBAR */
.sidebar{width:var(--sw);flex-shrink:0;background:var(--s);display:flex;flex-direction:column;overflow:hidden;z-index:500}
.sfh{padding:10px 14px 8px;font-size:9px;text-transform:uppercase;letter-spacing:2px;color:var(--sm);border-bottom:1px solid var(--sb);display:flex;justify-content:space-between;align-items:center;flex-shrink:0}
.sfh button{background:none;border:1px solid var(--sb);color:var(--sm);font-family:'DM Mono',monospace;font-size:9px;padding:2px 8px;cursor:pointer;text-transform:uppercase;letter-spacing:1px;transition:all .15s}
.sfh button:hover{border-color:var(--acc);color:var(--acc)}
.filters{padding:10px 14px;display:flex;flex-direction:column;gap:10px;border-bottom:1px solid var(--sb);flex-shrink:0}
.fg>label{display:block;font-size:9px;text-transform:uppercase;letter-spacing:1.5px;color:var(--sm);margin-bottom:4px}
.sb-sel{width:100%;background:rgba(255,255,255,.05);border:1px solid var(--sb);color:var(--st);font-family:'DM Sans',sans-serif;font-size:12px;padding:5px 7px;cursor:pointer;outline:none;transition:border-color .15s}
.sb-sel:focus,.sb-sel:hover{border-color:var(--acc)}
.pr{display:flex;flex-wrap:wrap;gap:3px}
.pill{background:rgba(255,255,255,.06);border:1px solid var(--sb);color:var(--sm);font-family:'DM Mono',monospace;font-size:9px;padding:2px 7px;cursor:pointer;letter-spacing:.5px;transition:all .12s}
.pill.on{background:var(--acc);border-color:var(--acc);color:#fff}
.pill:hover:not(.on){border-color:var(--sm);color:var(--st)}
.rg label{display:flex;justify-content:space-between;align-items:baseline;font-size:9px;text-transform:uppercase;letter-spacing:1.5px;color:var(--sm);margin-bottom:4px}
.rg label span{color:var(--amb);font-family:'DM Mono',monospace;font-size:12px}
input[type=range]{width:100%;accent-color:var(--acc);cursor:pointer}
/* KOORDINAT-TJEK */
.ck{padding:12px 14px;border-bottom:1px solid var(--sb);flex-shrink:0}
.ck-label{font-size:9px;text-transform:uppercase;letter-spacing:1.5px;color:var(--sm);margin-bottom:7px}
.ck-row{display:flex;gap:5px}
.ck-input{flex:1;background:rgba(255,255,255,.06);border:1px solid var(--sb);color:var(--st);font-family:'DM Mono',monospace;font-size:11px;padding:6px 8px;outline:none;min-width:0;transition:border-color .15s}
.ck-input::placeholder{color:var(--sm);font-size:10px}
.ck-input:focus{border-color:var(--acc)}
.ck-btn{background:var(--acc);border:none;color:#fff;font-family:'DM Mono',monospace;font-size:10px;padding:6px 10px;cursor:pointer;white-space:nowrap;letter-spacing:.5px;transition:background .15s;flex-shrink:0}
.ck-btn:hover{background:#4a9068}
.ck-result{margin-top:8px;font-size:11px;display:none}
.ck-hit{color:#f0c060;font-size:10px;text-transform:uppercase;letter-spacing:1px;margin-bottom:6px;display:flex;align-items:center;gap:5px}
.ck-hit::before{content:'';width:6px;height:6px;border-radius:50%;background:#f0c060;flex-shrink:0}
.ck-clear{color:var(--amb);font-size:10px;text-transform:uppercase;letter-spacing:1px;display:flex;align-items:center;gap:5px}
.ck-clear::before{content:'';width:6px;height:6px;border-radius:50%;background:var(--amb);flex-shrink:0}
.ck-atk{padding:5px 0;border-bottom:1px solid var(--sb);cursor:pointer;display:flex;gap:8px;align-items:baseline}
.ck-atk:last-child{border-bottom:none}
.ck-atk:hover{opacity:.8}
.ck-atk-n{font-family:'Syne',sans-serif;font-weight:800;font-size:16px;color:#f0c060;line-height:1;flex-shrink:0;width:24px;text-align:right}
.ck-atk-info{min-width:0}
.ck-atk-loc{font-size:11px;color:var(--st);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ck-atk-dist{font-size:10px;color:var(--sm)}
.ck-err{color:#e07050;font-size:10px}
.lh{padding:7px 14px;font-size:9px;text-transform:uppercase;letter-spacing:2px;color:var(--sm);border-bottom:1px solid var(--sb);display:flex;justify-content:space-between;flex-shrink:0}
.lh .lc{color:var(--amb);font-family:'DM Mono',monospace}
.alist{flex:1;overflow-y:auto}
.alist::-webkit-scrollbar{width:3px}
.alist::-webkit-scrollbar-thumb{background:var(--sb)}
.ai{padding:8px 14px;border-bottom:1px solid var(--sb);cursor:pointer;display:flex;gap:8px;align-items:flex-start;transition:background .1s}
.ai:hover{background:rgba(255,255,255,.04)}
.ai.sel{background:rgba(191,49,8,.18);border-left:2px solid var(--acc);padding-left:12px}
.ai-n{font-family:'Syne',sans-serif;font-weight:800;font-size:19px;color:var(--acc);line-height:1;flex-shrink:0;width:28px;text-align:right}
.ai-info{min-width:0;overflow:hidden}
.ai-loc{font-size:11px;color:var(--st);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ai-met{font-size:10px;color:var(--sm)}

/* MAP */
.mwrap{flex:1;position:relative;overflow:hidden}
#map{width:100%;height:100%}

/* Tooltip */
#tooltip{position:absolute;display:none;pointer-events:none;background:rgba(18,38,22,.92);backdrop-filter:blur(6px);border:1px solid rgba(100,180,100,.2);color:#c8dcc4;font-family:'DM Sans',sans-serif;font-size:11px;padding:9px 12px;z-index:400;min-width:165px;line-height:1.7;border-radius:2px}

/* Map legend */
.mleg{position:absolute;bottom:36px;right:10px;background:rgba(18,38,22,.85);backdrop-filter:blur(6px);border:1px solid rgba(100,180,100,.2);padding:10px 13px;font-size:10px;color:#b0ccb0;z-index:400;border-radius:2px}
.lr{display:flex;align-items:center;gap:7px;margin-bottom:4px}
.lr:last-child{margin-bottom:0}
.ld{width:9px;height:9px;border-radius:50%;flex-shrink:0}

/* DETAIL PANEL */
.dpanel{position:fixed;top:var(--hh);right:0;bottom:0;width:var(--pw);background:var(--wh);border-left:1px solid var(--bdr);transform:translateX(100%);transition:transform .28s cubic-bezier(.4,0,.2,1);z-index:500;display:flex;flex-direction:column;overflow:hidden;box-shadow:-8px 0 32px rgba(0,0,0,.15)}
.dpanel.open{transform:translateX(0)}
.dph{padding:15px 18px 12px;border-bottom:1px solid var(--bdr);display:flex;align-items:flex-start;justify-content:space-between;flex-shrink:0}
.dph-x{background:none;border:1px solid var(--bdr);cursor:pointer;padding:4px 9px;font-size:11px;color:var(--mt);flex-shrink:0;margin-left:10px;transition:all .15s}
.dph-x:hover{border-color:var(--acc);color:var(--acc)}
.dp-loc{font-family:'Syne',sans-serif;font-weight:800;font-size:19px;letter-spacing:-.3px;line-height:1.15}
.dp-muni{font-size:11px;color:var(--mt);margin-top:2px}
.dpbody{flex:1;overflow-y:auto;padding:20px 18px}
.dpbody::-webkit-scrollbar{width:4px}
.dpbody::-webkit-scrollbar-thumb{background:var(--bdr)}

/* Hero */
.hero{display:flex;align-items:flex-end;gap:16px;padding-bottom:18px;margin-bottom:18px;border-bottom:2px solid var(--bdr)}
.hero-big{font-family:'Syne',sans-serif;font-weight:800;font-size:68px;line-height:1;color:var(--acc)}
.hero-lbl{font-size:10px;text-transform:uppercase;letter-spacing:1px;color:var(--mt)}
.hero-date{font-family:'DM Mono',monospace;font-size:13px;margin-top:3px;color:var(--txt)}
.hero-time{font-size:11px;color:var(--mt);margin-top:1px}
.badges{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px}
.badge{display:inline-block;padding:3px 9px;font-size:9px;text-transform:uppercase;letter-spacing:.8px;font-family:'DM Mono',monospace}
.b-ok{background:#e4f2e8;color:#1a5a30;border:1px solid #9ecdb0}
.b-pr{background:#f8f4e4;color:#705a18;border:1px solid #d8c47a}
.b-wf{background:#ede8e0;color:#5a3818;border:1px solid #c8a880}
.b-fn{background:#e4f0ec;color:#1a5048;border:1px solid #88c4b0}

/* Section label */
.sec{font-size:9px;text-transform:uppercase;letter-spacing:2px;color:var(--mt);margin:18px 0 9px;display:flex;align-items:center;gap:8px}
.sec::after{content:'';flex:1;height:1px;background:var(--bdr)}

/* Animal cards */
.agrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(78px,1fr));gap:7px}
.acard{border:1px solid var(--bdr);padding:10px 6px;text-align:center}
.acard.ak{border-top:3px solid var(--acc)}
.acard.ai2{border-top:3px solid var(--amb)}
.ac-n{font-family:'Syne',sans-serif;font-weight:800;font-size:28px;line-height:1}
.acard.ak .ac-n{color:var(--acc)}
.acard.ai2 .ac-n{color:var(--amb)}
.ac-sp{font-size:11px;color:var(--mt);margin-top:2px}
.ac-st{font-size:8px;text-transform:uppercase;letter-spacing:.5px;color:var(--mt);margin-top:1px}

/* Info table */
.itbl{width:100%;border-collapse:collapse;font-size:12px;margin-bottom:4px}
.itbl tr{border-bottom:1px solid var(--bdr)}
.itbl tr:last-child{border-bottom:none}
.itbl td{padding:7px 0;vertical-align:top;line-height:1.4}
.itbl td:first-child{width:44%;font-size:10px;text-transform:uppercase;letter-spacing:.5px;color:var(--mt);padding-right:8px}
.itbl td:last-child{font-family:'DM Mono',monospace;font-size:11px;word-break:break-all}
.ok{color:#1a7a42} .no{color:#9a2a08}

/* Compensation block */
.comp-bar{background:var(--bg);border:1px solid var(--bdr);padding:12px 14px;margin-top:4px;display:flex;align-items:baseline;gap:8px}
.comp-num{font-family:'Syne',sans-serif;font-weight:800;font-size:24px;color:var(--txt)}
.comp-lbl{font-size:10px;color:var(--mt);text-transform:uppercase;letter-spacing:.5px}

/* Notes */
.dp-notes{background:var(--bg);border-left:3px solid #8ec49a;padding:11px 13px;font-size:12px;line-height:1.75;color:var(--mt);font-style:italic}

/* Leaflet overrides */
.leaflet-control-zoom{border:none!important;box-shadow:none!important}
.leaflet-control-zoom a{background:rgba(18,38,22,.85)!important;color:#c0d8be!important;border:1px solid rgba(100,180,100,.2)!important;backdrop-filter:blur(6px)}
.leaflet-control-zoom a:hover{background:var(--acc)!important;border-color:var(--acc)!important}
.leaflet-control-attribution{background:rgba(0,0,0,.45)!important;color:rgba(255,255,255,.45)!important;font-size:9px!important}
.leaflet-control-attribution a{color:rgba(255,255,255,.6)!important}
/* HAMBURGER BUTTON — hidden on desktop */
.hbtn{display:none;flex-direction:column;justify-content:center;align-items:center;gap:5px;padding:0 16px;background:none;border:none;cursor:pointer;height:100%;flex-shrink:0;margin-left:auto}
.hbtn span{display:block;width:20px;height:2px;background:var(--st);transition:all .2s;border-radius:1px}
.sb-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:490;backdrop-filter:blur(2px)}

/* ── TABLET (≤1024px) ── */
@media(max-width:1024px){
  :root{--sw:230px;--pw:340px}
  .hs:nth-child(n+4){display:none}
}

/* ── MOBILE (≤768px) ── */
@media(max-width:768px){
  :root{--hh:48px;--sw:82vw;--pw:100vw}

  /* Hide desktop header stats, show hamburger */
  .hstats{display:none}
  .hmock{display:none}
  .hbtn{display:flex;margin-left:auto}

  /* Sidebar slides in from left as drawer */
  .sidebar{
    position:fixed;
    top:var(--hh);left:calc(-1 * var(--sw));bottom:0;
    transition:left .28s cubic-bezier(.4,0,.2,1);
    z-index:550;
    box-shadow:4px 0 24px rgba(0,0,0,.35)
  }
  .sidebar.open{left:0}
  .sb-overlay.open{display:block}

  /* Map fills full width */
  .layout{flex-direction:column}
  .mwrap{flex:1;width:100vw}

  /* Detail panel rises from bottom as sheet */
  .dpanel{
    top:auto;left:0;right:0;bottom:0;
    width:100%;height:78vh;
    transform:translateY(100%);
    transition:transform .28s cubic-bezier(.4,0,.2,1);
    border-left:none;border-top:1px solid var(--bdr);
    border-radius:14px 14px 0 0
  }
  .dpanel.open{transform:translateY(0)}

  /* Drag handle on detail panel */
  .dpanel::before{
    content:'';display:block;
    width:40px;height:4px;border-radius:2px;
    background:var(--bdr);margin:10px auto 2px;flex-shrink:0
  }

  /* Bigger touch targets */
  .ai{padding:10px 14px}
  .pill{padding:5px 10px;font-size:10px}
  .sb-sel{padding:8px 7px;font-size:13px}
  .ck-btn{padding:9px 12px}
  .ck-input{padding:8px 8px;font-size:12px}
  .sfh button{padding:5px 10px}

  /* Map legend smaller */
  .mleg{font-size:9px;padding:7px 10px;bottom:12px;right:8px}

  /* Stat cards in detail panel: 2 col */
  .agrid{grid-template-columns:repeat(auto-fill,minmax(70px,1fr))}
}

/* ── SMALL MOBILE (≤400px) ── */
@media(max-width:400px){
  :root{--sw:92vw}
  .logo{font-size:13px;padding:0 12px}
}
</style>
</head>
<body>

<!-- HEADER -->
<header>
  <div class="logo">ULVEANGREB<em>·DK</em></div>
  <div class="hstats">
    <div class="hs"><div class="v" id="h-n">—</div><div class="l">Angreb</div></div>
    <div class="hs"><div class="v" id="h-k">—</div><div class="l">Dræbte dyr</div></div>
    <div class="hs"><div class="v" id="h-i">—</div><div class="l">Skadede dyr</div></div>
    <div class="hs"><div class="v" id="h-c">—</div><div class="l">Est. erstatning</div></div>
  </div>
  <div class="hmock">Mock-data · Ikke officielle tal</div>
  <button class="hbtn" id="hbtn" onclick="toggleSidebar()" aria-label="Menu">
    <span></span><span></span><span></span>
  </button>
</header>
<div class="sb-overlay" id="sb-overlay" onclick="toggleSidebar()"></div>

<!-- LAYOUT -->
<div class="layout">
  <aside class="sidebar">
    <div class="sfh"><span>Filtre</span><button onclick="resetAll()">Nulstil</button></div>
    <div class="filters">
      <div class="fg"><label>Kommune</label>
        <select class="sb-sel" id="fm" onchange="render()"><option value="">Alle kommuner</option></select>
      </div>
      <div class="fg"><label>År</label><div class="pr" id="fy"></div></div>
      <div class="fg"><label>Dyretype</label><div class="pr" id="fa"></div></div>
      <div class="rg">
        <label>Min. dræbte <span id="fkv">1</span></label>
        <input type="range" id="fk" min="1" max="20" value="1" step="1"
          oninput="document.getElementById('fkv').textContent=this.value;render()">
      </div>
      <div class="fg"><label>Status</label>
        <select class="sb-sel" id="fc" onchange="render()">
          <option value="">Alle</option><option value="1">Bekræftet</option><option value="0">Sandsynlig</option>
        </select>
      </div>
      <div class="fg"><label>Ulvesikret hegn</label>
        <select class="sb-sel" id="ff" onchange="render()">
          <option value="">Alle</option><option value="1">Bag ulvehegn</option><option value="0">Ingen ulvehegn</option>
        </select>
      </div>
    </div>
    <div class="ck">
      <div class="ck-label">Tjek 5 km radius af ulveangreb</div>
      <div class="ck-row">
        <input class="ck-input" id="ck-input" type="text" placeholder="56.1234, 9.5678"
          onkeydown="if(event.key==='Enter')checkCoord()">
        <button class="ck-btn" onclick="checkCoord()">Tjek</button>
      </div>
      <div class="ck-result" id="ck-result"></div>
    </div>
    <div class="lh"><span>Angreb</span><span class="lc" id="lc">—</span></div>
    <div class="alist" id="alist"></div>
  </aside>

  <div class="mwrap" id="mwrap">
    <div id="map"></div>
    <div id="tooltip"></div>
    <div class="mleg">
      <div class="lr"><div class="ld" style="background:#d47848"></div>1–4 dræbte</div>
      <div class="lr"><div class="ld" style="background:#c45a2a"></div>5–9 dræbte</div>
      <div class="lr"><div class="ld" style="background:#b83828"></div>10+ dræbte</div>
      <div class="lr"><div class="ld" style="border:1.5px dashed rgba(60,140,80,.85);background:rgba(60,140,80,.15);border-radius:2px;width:13px;height:9px"></div>Ulvezone</div>
    </div>
  </div>
</div>

<!-- DETAIL PANEL -->
<div class="dpanel" id="dpanel">
  <div class="dph">
    <div>
      <div class="dp-loc" id="dp-loc">—</div>
      <div class="dp-muni" id="dp-muni"></div>
    </div>
    <button class="dph-x" onclick="closeDetail()">✕ Luk</button>
  </div>
  <div class="dpbody" id="dpbody"></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>

const NOTES = [

function toggleSidebar(){
  const sb = document.querySelector('.sidebar');
  const ov = document.getElementById('sb-overlay');
  const btn = document.getElementById('hbtn');
  const open = sb.classList.toggle('open');
  ov.classList.toggle('open', open);
  // Animate hamburger to X
  btn.style.gap = open ? '0' : '5px';
  const spans = btn.querySelectorAll('span');
  if(open){
    spans[0].style.transform='translateY(7px) rotate(45deg)';
    spans[1].style.opacity='0';
    spans[2].style.transform='translateY(-7px) rotate(-45deg)';
  } else {
    spans[0].style.transform='';spans[1].style.opacity='';spans[2].style.transform='';
  }
}

let ckMarker = null, ckCircle = null;

function haversine(lat1,lon1,lat2,lon2){
  const R=6371, dLat=(lat2-lat1)*Math.PI/180, dLon=(lon2-lon1)*Math.PI/180;
  const a=Math.sin(dLat/2)**2+Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*Math.sin(dLon/2)**2;
  return R*2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a));
}

function checkCoord(){
  const raw = document.getElementById('ck-input').value.trim();
  const res = document.getElementById('ck-result');
  res.style.display = 'block';

  // Parse — accept "56.12, 9.45" or "56.12 9.45"
  const parts = raw.split(/[\s,;]+/).filter(Boolean);
  if(parts.length < 2){ res.innerHTML='<div class="ck-err">Skriv koordinater som: 56.1234, 9.5678</div>'; return; }
  const lat=parseFloat(parts[0]), lng=parseFloat(parts[1]);
  if(isNaN(lat)||isNaN(lng)||lat<54||lat>58||lng<7||lng>16){
    res.innerHTML='<div class="ck-err">Koordinaterne ser ikke ud til at ligge i Danmark</div>'; return;
  }

  // Remove previous
  if(ckMarker){ map.removeLayer(ckMarker); ckMarker=null; }
  if(ckCircle){ map.removeLayer(ckCircle); ckCircle=null; }

  // Draw 5 km circle
  ckCircle = L.circle([lat,lng],{
    radius:5000,
    color:'rgba(240,192,80,.85)',
    fillColor:'rgba(240,192,80,.07)',
    weight:1.5,
    dashArray:'5,4',
    fillOpacity:1
  }).addTo(map);

  // Draw pin
  ckMarker = L.circleMarker([lat,lng],{
    radius:5, fillColor:'#fff',
    color:'rgba(240,192,80,1)',
    weight:2.5, fillOpacity:1
  }).addTo(map);

  map.setView([lat,lng], Math.max(map.getZoom(),10), {animate:true});

  // Find nearby attacks (use all DATA, not just filtered)
  const nearby = DATA.map(d=>({...d, dist:haversine(lat,lng,d.lat,d.lng)}))
    .filter(d=>d.dist<=5)
    .sort((a,b)=>a.dist-b.dist);

  if(nearby.length===0){
    res.innerHTML='<div class="ck-clear">Ingen kendte ulveangreb inden for 5 km</div>';
  } else {
    const items = nearby.map(d=>`
      <div class="ck-atk" onclick="openDetail(${d.id})">
        <div class="ck-atk-n">${d.killed}</div>
        <div class="ck-atk-info">
          <div class="ck-atk-loc">${d.location}</div>
          <div class="ck-atk-dist">${d.dist.toFixed(1)} km · ${fmtDate(d.date,null)}</div>
        </div>
      </div>`).join('');
    res.innerHTML=`<div class="ck-hit">${nearby.length} angreb inden for 5 km</div>${items}`;

  style: {
    color: 'rgba(255,255,255,0.55)',
    weight: 0.9,
    fillOpacity: 0,
    dashArray: '4, 5',
    lineCap: 'round',
    lineJoin: 'round'
  },
  onEachFeature: function(feature, layer) {
    layer.on('mouseover', function() {
      layer.setStyle({ color: 'rgba(255,255,255,0.85)', weight: 1.3 });
    });
    layer.on('mouseout', function() {
      layer.setStyle({ color: 'rgba(255,255,255,0.55)', weight: 0.9 });
    });
  }
}).addTo(map);

markerGroup = L.layerGroup().addTo(map);

// Close detail when clicking map background
map.on('click', closeDetail);

// ── FILTER ──
function filtered(){
  const muni=document.getElementById('fm').value;
  const minK=+document.getElementById('fk').value;
  const conf=document.getElementById('fc').value;
  const fence=document.getElementById('ff').value;
  return DATA.filter(d=>{
    if(muni&&d.municipality!==muni)return false;
    if(d.killed<minK)return false;
    if(conf==='1'&&!d.confirmed)return false;
    if(conf==='0'&&d.confirmed)return false;
    if(fence==='1'&&!d.fence_secured)return false;
    if(fence==='0'&&d.fence_secured)return false;
    if(!AY.has(d.date.slice(0,4)))return false;
    if(!d.animals.some(a=>AA.has(a)))return false;
    return true;
  });
}

// ── RENDER ──
function render(){
  const data=filtered();
  const totK=data.reduce((s,d)=>s+d.killed,0);
  const totI=data.reduce((s,d)=>s+d.total_injured,0);
  const totC=data.reduce((s,d)=>s+d.compensation_dkk,0);
  document.getElementById('h-n').textContent=data.length;
  document.getElementById('h-k').textContent=totK;
  document.getElementById('h-i').textContent=totI;
  document.getElementById('h-c').textContent=totC>0?totC.toLocaleString('da-DK')+' kr':'-';
  document.getElementById('lc').textContent=data.length;

  markerGroup.clearLayers();
  data.forEach(d=>{
    const isSelected = d.id===selId;
    const m = L.circleMarker([d.lat,d.lng],{
      radius: dotR(d.killed),
      fillColor: dotColor(d.killed),
      color: isSelected ? '#ffffff' : 'rgba(0,0,0,0.25)',
      weight: isSelected ? 2 : 0.8,
      opacity: 1,
      fillOpacity: 0.9
    });

    m.on('mouseover', function(e){
      const mwrapRect=document.getElementById('mwrap').getBoundingClientRect();
      let x=e.originalEvent.clientX-mwrapRect.left;
      let y=e.originalEvent.clientY-mwrapRect.top;
      if(x+185>mwrapRect.width-20)x=x-190;
      const tip=document.getElementById('tooltip');
      tip.innerHTML=`<strong style="font-size:13px;display:block;margin-bottom:3px;">${d.killed} dræbte · ${d.total_injured} skadede</strong>${d.location}, ${d.municipality}<br>${fmtDate(d.date,d.time)}<br>${d.animals.join(', ')}${d.wolf_name?`<br><span style="color:#a8d498;">🐺 ${d.wolf_name}</span>`:''}`;
      tip.style.display='block';
      tip.style.left=(x+14)+'px';
      tip.style.top=(y-12)+'px';
      this.setStyle({color:'#ffffff',weight:2.5});
    });
    m.on('mouseout', function(){
      document.getElementById('tooltip').style.display='none';
      this.setStyle({color:isSelected?'#ffffff':'rgba(0,0,0,0.25)',weight:isSelected?2:0.8});
    });
    m.on('click', function(e){
      L.DomEvent.stopPropagation(e);
      openDetail(d.id);
    });

    markerGroup.addLayer(m);
  });

  renderList(data);
}

function renderList(data){
  const sorted=[...data].sort((a,b)=>new Date(b.date)-new Date(a.date));
  document.getElementById('alist').innerHTML=sorted.map(d=>`
    <div class="ai${d.id===selId?' sel':''}" onclick="openDetail(${d.id})">
      <div class="ai-n">${d.killed}</div>
      <div class="ai-info">
        <div class="ai-loc">${d.location}</div>
        <div class="ai-met">${fmtDate(d.date)} · ${d.municipality}</div>
      </div>
    </div>`).join('');
}

// ── DETAIL PANEL ──
function openDetail(id){
  selId=id;
  const d=DATA.find(x=>x.id===id);
  if(!d)return;
  document.getElementById('dp-loc').textContent=d.location;
  document.getElementById('dp-muni').textContent=`${d.municipality} Kommune`;

  let akill='',ainj='';
  d.animals_detail.forEach(a=>{
    if(a.killed>0)akill+=`<div class="acard ak"><div class="ac-n">${a.killed}</div><div class="ac-sp">${a.sp}</div><div class="ac-st">Dræbt</div></div>`;
    if(a.injured>0)ainj+=`<div class="acard ai2"><div class="ac-n">${a.injured}</div><div class="ac-sp">${a.sp}</div><div class="ac-st">Skadet</div></div>`;
  });

  const sb=d.confirmed
    ?'<span class="badge b-ok">✓ DNA-bekræftet</span>'
    :'<span class="badge b-pr">~ Sandsynlig</span>';
  const wb=d.wolf_id?`<span class="badge b-wf">🐺 ${d.wolf_id}</span>`:'';
  const fb=d.fence_secured?'<span class="badge b-fn">▣ Bag ulvehegn</span>':'';

  document.getElementById('dpbody').innerHTML=`
    <div class="hero">
      <div class="hero-big">${d.killed}</div>
      <div>
        <div class="hero-lbl">Dræbte dyr</div>
        <div class="hero-date">${fmtDate(d.date,null)}</div>
        <div class="hero-time">Kl. ${d.time} (estimeret)</div>
        <div class="badges">${sb}${wb}${fb}</div>
      </div>
    </div>

    <div class="sec">Dyretab</div>
    <div class="agrid">${akill}${ainj}</div>

    ${d.wolf_id?`
    <div class="sec">Ulv</div>
    <table class="itbl">
      <tr><td>ID</td><td>${d.wolf_id}</td></tr>
      <tr><td>Navn</td><td>${d.wolf_name}</td></tr>
      <tr><td>Køn</td><td>${d.wolf_sex}</td></tr>
      <tr><td>Oprindelse</td><td>${d.wolf_origin}</td></tr>
      <tr><td>Født ca.</td><td>${d.wolf_born}</td></tr>
    </table>`:`
    <div class="sec">Ulv</div>
    <table class="itbl">
      <tr><td>ID</td><td><span class="no">Ikke identificeret</span></td></tr>
      <tr><td>Bekræftelse</td><td>Spor og bidmønster</td></tr>
    </table>`}

    <div class="sec">Hegn & erstatning</div>
    <table class="itbl">
      <tr><td>Hegnstype</td><td>${d.fence_desc}</td></tr>
      <tr><td>Opfyldte krav</td><td>${d.fence_secured?'<span class="ok">Ja</span>':'<span class="no">Nej</span>'}</td></tr>
    </table>
    <div class="comp-bar">
      <div class="comp-num">${fmtDkk(d.compensation_dkk)}</div>
      <div class="comp-lbl">Estimeret erstatning</div>
    </div>

    <div class="sec">Sagsoplysninger</div>
    <table class="itbl">
      <tr><td>Sagsnummer</td><td>${d.report_number}</td></tr>
      <tr><td>Kilde</td><td>${d.source}</td></tr>
      <tr><td>Koordinater</td><td>${d.lat.toFixed(4)}°N, ${d.lng.toFixed(4)}°E</td></tr>
      <tr><td>Kommune</td><td>${d.municipality}</td></tr>
    </table>

    <div class="sec">Hændelsesnotat</div>
    <div class="dp-notes">${d.notes}</div>
  `;

  document.getElementById('dpanel').classList.add('open');
  render();
}

function closeDetail(){
  selId=null;
  document.getElementById('dpanel').classList.remove('open');
  render();
}

function resetAll(){
  document.getElementById('fm').value='';
  document.getElementById('fk').value=1;document.getElementById('fkv').textContent='1';
  document.getElementById('fc').value='';document.getElementById('ff').value='';
  document.querySelectorAll('.pill[data-y]').forEach(el=>{el.classList.add('on');AY.add(el.dataset.y);});
  document.querySelectorAll('.pill[data-a]').forEach(el=>{el.classList.add('on');AA.add(el.dataset.a);});
  render();
}

// ── POPULATE SELECTS ──
[...new Set(DATA.map(d=>d.municipality))].sort().forEach(m=>{
  const o=document.createElement('option');o.value=m;o.textContent=m;
  document.getElementById('fm').appendChild(o);
});
[...new Set(DATA.map(d=>d.date.slice(0,4)))].sort().forEach(y=>{
  AY.add(y);
  const b=document.createElement('button');b.className='pill on';b.dataset.y=y;b.textContent=y;
  b.onclick=function(){this.classList.toggle('on');if(this.classList.contains('on'))AY.add(y);else AY.delete(y);render();};
  document.getElementById('fy').appendChild(b);
});
[...new Set(DATA.flatMap(d=>d.animals))].sort().forEach(a=>{
  AA.add(a);
  const b=document.createElement('button');b.className='pill on';b.dataset.a=a;b.textContent=a;
  b.onclick=function(){this.classList.toggle('on');if(this.classList.contains('on'))AA.add(a);else AA.delete(a);render();};
  document.getElementById('fa').appendChild(b);
});

render();
</script>
</body>
</html>
